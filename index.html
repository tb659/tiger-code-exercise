<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐯</text></svg>"
    />
    <title>虎码字根练习</title>
    <link rel="stylesheet" href="styles/index.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="data/roots.js"></script>
    <script defer src="data/roots_merged.js"></script>
    <script defer src="scripts/index.js"></script>
  </head>
  <body class="theme-solarized">
    <div class="app">
      <header>
        <div class="title">虎码字根练习</div>
        <div class="top-meta">
          <div class="side-controls">
            <div class="size-controls">
              <button class="size-btn" id="sizeDown" type="button" aria-label="缩小">小</button>
              <button class="size-btn" id="sizeUp" type="button" aria-label="放大">大</button>
            </div>
            <div class="mode-switch" role="group" aria-label="主题">
              <button class="mode-btn is-active" id="themeLight" type="button" aria-pressed="true">白</button>
              <button class="mode-btn" id="themeDark" type="button" aria-pressed="false">黑</button>
            </div>
            <label class="palette-select" aria-label="配色">
              <select id="paletteSelect" aria-label="配色">
                <option value="auto">Auto</option>
                <option value="one">One</option>
                <option value="solarized">Solarized</option>
                <option value="nord">Nord</option>
                <option value="catppuccin">Catppuccin</option>
                <option value="gruvbox">Gruvbox</option>
                <option value="tokyonight">Tokyo</option>
                <option value="rosepine">Rose</option>
              </select>
            </label>
            <div class="mode-switch" role="group" aria-label="界面显示">
              <button class="mode-btn is-active" id="uiShow" type="button" aria-pressed="true" title="始终显示代码和拼音">不隐</button>
              <button class="mode-btn" id="uiHalf" type="button" aria-pressed="false" title="输入前隐藏，输入后显示代码">半隐</button>
              <button class="mode-btn" id="uiFull" type="button" aria-pressed="false" title="始终隐藏代码和拼音">全隐</button>
            </div>
          </div>
          <div class="controls">
            <div class="mode-switch" role="group" aria-label="字根模式">
              <button class="mode-btn is-active" id="modeAll" type="button" aria-pressed="true">全字根</button>
              <button class="mode-btn" id="modeMerged" type="button" aria-pressed="false">归并字根</button>
            </div>
            <div class="mode-switch" role="group" aria-label="练习模式">
              <button class="mode-btn" id="reviewLearn" type="button" aria-pressed="false" title="首次出现显示代码，视为答错；使用遗忘曲线安排复习；不显示准确率">学习</button>
              <button class="mode-btn is-active" id="reviewOff" type="button" aria-pressed="true" title="使用遗忘曲线安排复习">普通</button>
              <button class="mode-btn" id="reviewOn" type="button" aria-pressed="false" title="不使用遗忘曲线，仅按题目顺序练习">复习</button>
              <button class="mode-btn" id="reviewFollow" type="button" aria-pressed="false" title="始终显示代码，适合跟打练习">跟打</button>
              <button class="mode-btn" id="reviewWrong" type="button" aria-pressed="false" title="答错加入错题集合，使用遗忘曲线安排复习">错题</button>
            </div>
          </div>
        </div>
      </header>

      <section class="card" id="card">
        <div class="card-meta">
          <div class="stat stat-accuracy">准确率：<strong id="accuracy">0%</strong></div>
          <div class="stat stat-progress">进度：<strong id="progressInfo">0/0</strong></div>
          <div class="stat stat-crown is-empty" id="roundCrown"></div>
          <div class="stat stat-timer">计时：<strong id="timer">00:00</strong></div>
          <div class="stat stat-wrong">错题进度：<strong id="wrongProgress">0/0</strong></div>
          <div class="wrong-actions" id="wrongActions">
            <button class="wrong-action-btn" id="removeCurrentWrong" type="button" title="删除当前错题">删除</button>
            <button class="wrong-action-btn wrong-action-btn--danger" id="clearAllWrong" type="button" title="清空所有错题">
              清空
            </button>
          </div>
        </div>
        <div class="root-char" id="rootChar">?</div>
        <div class="reveal" id="reveal" aria-live="polite"></div>

        <div class="input-wrap" id="inputWrap">
          <input
            class="code-input"
            id="codeInput"
            type="text"
            inputmode="latin"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            maxlength="2"
          />
          <div class="code-boxes" id="codeBoxes" aria-hidden="true">
            <div class="code-box" data-pos="0"></div>
            <div class="code-box" data-pos="1"></div>
          </div>
        </div>
      </section>

      <footer class="footer">
        <div class="footer-row footer-row--legal">
          <span aria-hidden="true"></span>
          <span class="footer-center">
            <span>© 2026 虎码字根练习</span>
            <span>&nbsp;&nbsp;</span>
            <a class="footer-link" href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">
              <img class="footer-icon" src="images/icp.png" alt="ICP备案" width="14" height="14" />
              <span>皖ICP备2023005643号</span>
              <span>&nbsp;&nbsp;</span>
            </a>
            <a
              class="footer-link"
              href="http://www.beian.gov.cn/portal/registerSystem?recordcode=34120402000424"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img class="footer-icon" src="images/beian.png" alt="公安备案" width="14" height="14" />
              <span>皖公网安备34120402000424号</span>
              <span>&nbsp;&nbsp;</span>
            </a>
          </span>
          <span class="footer-right">
            <a class="footer-link" href="https://www.tiger-code.com/" target="_blank" rel="noopener noreferrer">虎码</a>
            <a class="footer-link" href="https://github.com/tb659/tiger-code-exercise" target="_blank" rel="noopener noreferrer"
              >GitHub</a
            >
          </span>
        </div>
      </footer>
      <div class="sync-bar" id="syncBar">
        <span class="sync-status" id="syncStatus">云同步未连接</span>
        <button class="sync-btn" id="syncSetup" type="button">连接</button>
        <input class="sync-id-input" id="syncIdInput" type="text" placeholder="粘贴旧设备 ID 可同步进度" style="display: none" />
        <button class="sync-btn" id="syncIdConfirm" type="button" style="display: none">确认</button>
        <button class="sync-btn" id="sync" type="button" style="display: none">同步</button>
        <span class="sync-id-display" id="syncIdDisplay" style="display: none" title="点击复制"></span>
      </div>
    </div>
  </body>
</html>
